<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Background</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100%;
    height:100vh;
    background:#000000;
    font-family:Arial, sans-serif;
    position:relative;
    overflow:hidden;
}

/* LOGIN TEXT */
.login-text{
    position:absolute;
    top:40%;
    left:50%;
    transform:translate(-50%, -50%);
    color:#ffffff;
    font-size:20px;
    font-weight:bold;
    letter-spacing:2px;
}

/* KEY TEXT */
.name-text{
    position:absolute;
    top:48%;
    left:20px;
    color:#ffffff;
    font-size:15px;
    font-weight:bold;
}

/* INPUT */
.name-input{
    position:absolute;
    top:50%;
    left:20px;

    width:250px;
    padding:8px 0;

    background:transparent;
    border:none;
    border-bottom:2px solid #ffffff;

    color:#ffffff;
    font-size:16px;
    outline:none;
}

.name-input::placeholder{
    color:#aaaaaa;
}

/* BUTTON */
.login-btn{
    position:absolute;
    top:60%;
    left:20px;

    width:250px;
    height:45px;

    border:none;
    background:#ffffff;
    color:#000000;

    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}
</style>

</head>
<body>

<div class="login-text">LOGIN</div>

<div class="name-text">KEY</div>

<input 
type="text" 
class="name-input" 
id="keyInput"
placeholder="ENTER PAGE NAME"
>

<button class="login-btn" onclick="openPage()">
ENTER
</button>

<script>
function openPage(){

    let pageName = document.getElementById("keyInput").value.trim();

    if(pageName === ""){
        alert("ENTER PAGE NAME");
        return;
    }

    // EXAMPLE:
    // 1002  -> 1002.html
    // 1003  -> 1003.html

    window.location.href = pageName + ".html";
}
</script>

</body>
</html>
