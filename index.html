<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LTS Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100%;
    height:100vh;
    background:#000;
    font-family:Arial, sans-serif;
    position:relative;
}

/* LOGIN TEXT */
.login-text{
    position:absolute;
    top:40%;
    left:50%;
    transform:translate(-50%,-50%);
    color:#fff;
    font-size:20px;
    font-weight:bold;
}

/* INPUT BOX WRAPPER */
.input-box{
    position:absolute;
    top:50%;
    left:20px;
    width:280px;
    border-bottom:2px solid #fff;
}

/* INPUT */
.name-input{
    width:100%;
    padding:8px 0;
    background:transparent;
    border:none;
    color:#fff;
    font-size:16px;
    outline:none;
}

/* REGISTER TEXT */
.register{
    position:absolute;
    right:-40px;   /* 🔥 තව දකුනට */
    bottom:-22px;
    color:#fff;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
    letter-spacing:1px;
}

.register:hover{
    color:#00ffcc;
}

/* ERROR */
.error-text{
    position:absolute;
    top:58%;
    left:20px;
    color:red;
    font-size:14px;
    font-weight:bold;
    display:none;
}
</style>

</head>
<body>

<div class="login-text">LOGIN</div>

<div class="input-box">
    <input 
        type="text"
        class="name-input"
        id="keyInput"
        placeholder="ENTER 9 DIGIT CODE"
        maxlength="9"
    >
    <div class="register" onclick="openWhatsApp()">REGISTER</div>
</div>

<div class="error-text" id="errorText">ERROR: INVALID CODE</div>

<script>
const input = document.getElementById("keyInput");
const errorText = document.getElementById("errorText");

input.addEventListener("input", function () {

    this.value = this.value.replace(/\D/g, "");
    errorText.style.display = "none";

    if (this.value.length === 9) {

        let page = this.value + ".html";

        fetch(page, { method: "HEAD" })
        .then(res => {
            if (res.ok) {
                window.location.href = page;
            } else {
                errorText.style.display = "block";
            }
        })
        .catch(() => {
            errorText.style.display = "block";
        });
    }
});

/* WHATSAPP REGISTER */
function openWhatsApp(){
    window.location.href = "https://wa.me/94702564087";
}
</script>

</body>
</html>
