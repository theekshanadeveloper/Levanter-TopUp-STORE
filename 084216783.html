<!DOCTYPE html>
<html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport"  
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">  

<title>LST HOME</title>  

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">  

<style>  
*{  
margin:0;  
padding:0;  
box-sizing:border-box;  
-webkit-user-select:none;  
-ms-user-select:none;  
user-select:none;  
-webkit-tap-highlight-color:transparent;  
}  

html,body{  
touch-action:manipulation;  
overflow:hidden;  
}  

body{  
width:100%;  
height:100vh;  
position:relative;  
overflow:hidden;  
font-family:Arial,sans-serif;  
}  

body::before{  
content:"";  
position:absolute;  
top:0;  
left:0;  
width:100%;  
height:100%;  
background-image:url("https://i.postimg.cc/jjds88C8/IMG-20260513154547068.jpg");  
background-size:cover;  
background-position:center;  
filter:blur(8px);  
transform:scale(1.1);  
z-index:-1;  
}  

.logo{  
position:absolute;  
top:30px;  
left:50%;  
transform:translateX(-50%);  
}  

.logo img{  
width:120px;  
height:auto;  
}  

.ads-box{  
position:absolute;  
top:100px;  
left:50%;  
transform:translateX(-50%);  
width:95%;  
max-width:500px;  
height:140px;  
border:2px dashed #ccc;  
border-radius:10px;  
background-image:url("https://i.postimg.cc/LXzwrbvr/IMG-20260513-181145.jpg");  
background-size:cover;  
background-position:center;  
background-repeat:no-repeat;  
}  

.ads-title{  
position:absolute;  
top:8px;  
left:10px;  
font-size:12px;  
font-weight:bold;  
color:#000;  
}  

.ads-info{  
position:absolute;  
top:30px;  
left:10px;  
font-size:18px;  
font-weight:bold;  
line-height:28px;  
color:#000;  
}  

/* ✅ FIXED STATUS INSIDE ADS BOX */  
#statusText{  
position:absolute;  
bottom:8px;  
left:0;  
width:100%;  
text-align:center;  
font-size:14px;  
font-weight:bold;  
display:none;  
color:lime;  
text-shadow:0 0 5px lime;  
}  

.submit-btn{  
position:absolute;  
right:10px;  
bottom:10px;  
padding:8px 16px;  
background:blue;  
color:#fff;  
border:none;  
border-radius:6px;  
font-size:14px;  
font-weight:bold;  
cursor:pointer;  
display:none;  
}  

.profile-header{  
position:absolute;  
top:255px;  
width:100%;  
padding:0 10px;  
display:flex;  
justify-content:space-between;  
align-items:center;  
}  

.profile-text{  
font-size:20px;  
font-weight:bold;  
color:#000;  
}  

.balance{  
font-size:20px;  
font-weight:bold;  
border:2px solid #000;  
border-radius:6px;  
padding:4px 10px;  
background:#ffffffcc;  
color:#000;  
}  

.profile-details{  
position:absolute;  
top:290px;  
left:10px;  
font-size:14px;  
line-height:25px;  
font-weight:bold;  
color:#000;  
}  

.profile-icons{  
margin-top:10px;  
font-size:18px;  
}  

.profile-icons i{  
margin-right:18px;  
cursor:pointer;  
}  

.store-section{  
position:absolute;  
top:410px;  
left:0;  
width:100%;  
height:350px;  
overflow-y:auto;  
overflow-x:hidden;  
padding-bottom:50px;  
white-space:normal;  
}  

.store-section::-webkit-scrollbar{  
display:none;  
}  

.store-header{  
position:relative;  
left:10px;  
margin-bottom:20px;  
}  

.store-text{  
font-size:20px;  
font-weight:bold;  
color:#000;  
}  

.store-box{  
position:relative;  
width:140px;  
height:150px;  
border:2px solid #000;  
border-radius:10px;  
display:inline-flex;  
flex-direction:column;  
align-items:center;  
padding-top:10px;  
background-image:url("https://i.postimg.cc/KYLm8QJ3/IMG-20260513-181924.jpg");  
background-size:cover;  
background-position:center;  
background-repeat:no-repeat;  
cursor:pointer;  
margin:10px;  
color:#000;  
vertical-align:top;  
}  

.w-icon{  
font-size:25px;  
margin-bottom:6px;  
}  

.box-text{  
font-size:12px;  
font-weight:bold;  
}  

.price-text{  
font-size:18px;  
font-weight:bold;  
margin-top:10px;  
}  

.counter{  
position:relative;  
width:100%;  
margin-top:12px;  
height:30px;  
}  

.minus,.plus{  
position:absolute;  
width:25px;  
height:25px;  
border:1px solid #000;  
background:#fff;  
font-size:16px;  
font-weight:bold;  
}  

.minus{left:10px;}  
.plus{right:10px;}  

.counter span{  
position:absolute;  
left:50%;  
transform:translateX(-50%);  
top:6px;  
font-size:14px;  
font-weight:bold;  
}  
</style>  
</head>  

<body>  

<div class="logo">  
<img src="https://i.postimg.cc/ZqTQjKhf/1000103592-removebg-preview.png">  
</div>  

<div class="ads-box">  
<div class="ads-title">YOUR BILL</div>  
<div class="ads-info">  
SELECT - <span id="selected">NONE</span><br>  
UID - 6581790759<br>  
TOTAL - <span id="billPrice">0</span>  
<div id="statusText"></div>  
</div>  
<button class="submit-btn" id="submitBtn">SUBMIT</button>  
</div>  

<div class="profile-header">  
<div class="profile-text">PROFILE</div>  
<div class="balance" id="balanceText">LKR - 0000.00</div>  
</div>  

<div class="profile-details">  
NAME - BINETH DULMIRA<br>  
UID - 6581790759<br>  
ADDRESS - 6581790759-1001<br>  

<div class="profile-icons">  
<i class="fa-solid fa-message" onclick="location.href='message.html'"></i>  
<i class="fa-solid fa-headset" onclick="window.open('https://wa.me/94702564087','_blank')"></i>  
<i class="fa-solid fa-building-columns" onclick="location.href='bank.html'"></i>  
</div>  
</div>  

<div class="store-section">  

<div class="store-header">  
<div class="store-text">TOP UP STORE</div>  
</div>  

<div class="store-box" id="box1" onclick="selectItem('WEEKLY LITE',220,'count1','box1')">  
<div class="w-icon">W</div>  
<div class="box-text">WEEKLY LITE</div>  
<div class="price-text">LKR 220.00</div>  
<div class="counter">  
<button class="minus" onclick="event.stopPropagation(); change('count1',false)">-</button>  
<span id="count1">0</span>  
<button class="plus" onclick="event.stopPropagation(); change('count1',true)">+</button>  
</div>  
</div>  

<div class="store-box" id="box2" onclick="selectItem('WEEKLY',605,'count2','box2')">  
<div class="w-icon">W</div>  
<div class="box-text">WEEKLY</div>  
<div class="price-text">LKR 605.00</div>  
<div class="counter">  
<button class="minus" onclick="event.stopPropagation(); change('count2',false)">-</button>  
<span id="count2">0</span>  
<button class="plus" onclick="event.stopPropagation(); change('count2',true)">+</button>  
</div>  
</div>  

<div class="store-box" id="box3" onclick="selectItem('MONTHLY',2640,'count3','box3')">  
<div class="w-icon">M</div>  
<div class="box-text">MONTHLY</div>  
<div class="price-text">LKR 2640.00</div>  
<div class="counter">  
<button class="minus" onclick="event.stopPropagation(); change('count3',false)">-</button>  
<span id="count3">0</span>  
<button class="plus" onclick="event.stopPropagation(); change('count3',true)">+</button>  
</div>  
</div>  

</div>  

<script type="module">  
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";  
import { getDatabase, ref, push, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";  

const firebaseConfig = {  
apiKey: "AIzaSyDdlxuM-11z-ahfHyPSPQeabds02s9C8ag",  
authDomain: "project-001-1v.firebaseapp.com",  
databaseURL: "https://project-001-1v-default-rtdb.asia-southeast1.firebasedatabase.app",  
projectId: "project-001-1v",  
storageBucket: "project-001-1v.firebasestorage.app",  
messagingSenderId: "778010407586",  
appId: "1:778010407586:web:3b527def1374705d4dddfb",  
measurementId: "G-VG8EYJBH3B"  
};  

const app = initializeApp(firebaseConfig);  
const db = getDatabase(app);  

const uid = "6581790759-1001";  

let balance = 0;  
let selectedPrice = 0;  
let currentSelected = "";  

const balanceText = document.getElementById("balanceText");  

onValue(ref(db, "ACCOUNT UPGRADE/" + uid), (snap) => {  
const data = snap.val();  
if(data && data.bank){  
balance = parseFloat(data.bank);  
}  
balanceText.innerText = "LKR - " + balance.toFixed(2);  
});  

onValue(ref(db, "topup_orders"), (snap) => {  
let found = false;  
snap.forEach((child) => {  
const data = child.val();  
if(data.uid === uid){  
found = true;  
}  
});  

const statusText = document.getElementById("statusText");  
const submitBtn = document.getElementById("submitBtn");  

if(found){  
statusText.style.display = "block";  
statusText.innerText = "SUCCESS! WAIT 24 HOURS";  
submitBtn.disabled = true;  
submitBtn.style.opacity = "0.5";  
submitBtn.style.cursor = "not-allowed";  
}else{  
statusText.style.display = "none";  
submitBtn.disabled = false;  
submitBtn.style.opacity = "1";  
submitBtn.style.cursor = "pointer";  
}  
});  

window.selectItem = function(name, price, id){  
document.getElementById("count1").innerText = 0;  
document.getElementById("count2").innerText = 0;  
document.getElementById("count3").innerText = 0;  

currentSelected = id;  
selectedPrice = price;  

document.getElementById("selected").innerText = name;  
updateBill();  
}  

window.change = function(id, add){  
if(currentSelected !== id) return;  

let el = document.getElementById(id);  
let val = parseInt(el.innerText);  

val = add ? val + 1 : Math.max(0, val - 1);  
el.innerText = val;  

updateBill();  
}  

function updateBill(){  
if(!currentSelected) return;  

let qty = parseInt(document.getElementById(currentSelected).innerText);  
let total = qty * selectedPrice;  

document.getElementById("billPrice").innerText = total;  

document.getElementById("submitBtn").style.display = total > 0 ? "block" : "none";  
}  

document.getElementById("submitBtn").onclick = async function(){  
let total = parseInt(document.getElementById("billPrice").innerText);  

const statusText = document.getElementById("statusText");  

const snap = await new Promise((resolve) => {  
onValue(ref(db, "topup_orders"), resolve, { onlyOnce: true });  
});  

let alreadyOrdered = false;  

snap.forEach((child) => {  
const data = child.val();  
if(data.uid === uid){  
alreadyOrdered = true;  
}  
});  

if(alreadyOrdered){  
statusText.style.display = "block";  
statusText.innerText = "SUCCESS! WAIT 24 HOURS";  
return;  
}  

if(total > balance){  
statusText.style.display = "block";  
statusText.innerText = "NOT ENOUGH BALANCE";  

setTimeout(() => {  
if(statusText.innerText === "NOT ENOUGH BALANCE"){  
statusText.style.display = "none";  
statusText.innerText = "";  
}  
}, 3000);  

return;  
}  

let selected = document.getElementById("selected").innerText;  
let qty = parseInt(document.getElementById(currentSelected).innerText);  

await set(push(ref(db,"topup_orders")), {  
uid: uid,  
select: selected,  
quantity: qty,  
bill: total,  
time: new Date().toLocaleString(),  
name: "BINETH DULMIRA"  
});  

await update(ref(db,"ACCOUNT UPGRADE/"+uid), {  
bank: balance - total  
});  

statusText.style.display = "block";  
statusText.innerText = "SUCCESS! WAIT 24 HOURS";  
};  

</script>  

</body>  
</html>
