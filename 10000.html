<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>TOP UP STORE</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-user-select:none;
-ms-user-select:none;
user-select:none;
-webkit-tap-highlight-color:transparent;
}

html,body{
touch-action:manipulation;
overflow:hidden;
}

body{
width:100%;
height:100vh;
position:relative;
overflow:hidden;
font-family:Arial,sans-serif;
}

body::before{
content:"";
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background-image:url("https://i.postimg.cc/jjds88C8/IMG-20260513154547068.jpg");
background-size:cover;
background-position:center;
filter:blur(8px);
transform:scale(1.1);
z-index:-1;
}

.logo{
position:absolute;
top:30px;
left:50%;
transform:translateX(-50%);
}

.logo img{
width:120px;
height:auto;
}

.ads-box{
position:absolute;
top:100px;
left:50%;
transform:translateX(-50%);
width:95%;
max-width:500px;
height:140px;
border:2px dashed #ccc;
border-radius:10px;
background-image:url("https://i.postimg.cc/LXzwrbvr/IMG-20260513-181145.jpg");
background-size:cover;
background-position:center;
background-repeat:no-repeat;
}

.ads-title{
position:absolute;
top:8px;
left:10px;
font-size:12px;
font-weight:bold;
color:#000;
}

.ads-info{
position:absolute;
top:30px;
left:10px;
font-size:18px;
font-weight:bold;
line-height:28px;
color:#000;
}

.submit-btn{
position:absolute;
right:10px;
bottom:10px;
padding:8px 16px;
background:blue;
color:#fff;
border:none;
border-radius:6px;
font-size:14px;
font-weight:bold;
cursor:pointer;
display:none;
}

.profile-header{
position:absolute;
top:255px;
width:100%;
padding:0 10px;
display:flex;
justify-content:space-between;
align-items:center;
}

.profile-text{
font-size:20px;
font-weight:bold;
color:#000;
}

.balance{
font-size:20px;
font-weight:bold;
border:2px solid #000;
border-radius:6px;
padding:4px 10px;
background:#ffffffcc;
color:#000;
}

.profile-details{
position:absolute;
top:290px;
left:10px;
font-size:14px;
line-height:25px;
font-weight:bold;
color:#000;
}

/* STORE SECTION */
.store-section{
position:absolute;
top:410px;
left:0;
width:100%;
height:350px;
overflow-y:auto;
overflow-x:hidden;
padding-bottom:50px;
white-space:normal;
}

/* SCROLLBAR HIDE */
.store-section::-webkit-scrollbar{
display:none;
}

.store-header{
position:relative;
left:10px;
margin-bottom:20px;
}

.store-text{
font-size:20px;
font-weight:bold;
color:#000;
}

.store-box{
position:relative;
width:140px;
height:150px;
border:2px solid #000;
border-radius:10px;
display:inline-flex;
flex-direction:column;
align-items:center;
padding-top:10px;
background-image:url("https://i.postimg.cc/KYLm8QJ3/IMG-20260513-181924.jpg");
background-size:cover;
background-position:center;
background-repeat:no-repeat;
cursor:pointer;
transition:0.2s;
margin:10px;
color:#000;
vertical-align:top;
}

.active{
border:2px solid blue;
}

.w-icon{
font-size:25px;
font-weight:bold;
margin-bottom:6px;
color:#000;
}

.box-text{
font-size:12px;
font-weight:bold;
color:#000;
}

.price-text{
font-size:18px;
font-weight:bold;
margin-top:10px;
color:#000;
}

.counter{
position:relative;
width:100%;
margin-top:12px;
height:30px;
}

.minus,.plus{
position:absolute;
width:25px;
height:25px;
border:1px solid #000;
background:#fff;
font-size:16px;
font-weight:bold;
color:#000;
}

.minus{
left:10px;
}

.plus{
right:10px;
}

.counter span{
position:absolute;
left:50%;
transform:translateX(-50%);
top:6px;
font-size:14px;
font-weight:bold;
color:#000;
}
</style>
</head>

<body>

<div class="logo">
<img src="https://i.postimg.cc/ZqTQjKhf/1000103592-removebg-preview.png">
</div>

<div class="ads-box">

<div class="ads-title">ADS / BILL</div>

<div class="ads-info">
SELECT - <span id="selected">NONE</span><br>
UID - 13718578239<br>
TOTAL - <span id="billPrice">0</span>
</div>

<button class="submit-btn" id="submitBtn">SUBMIT</button>
</div>

<div class="profile-header">

<div class="profile-text">PROFILE</div>

<div class="balance" id="balanceText">
LKR - 5000.00
</div>

</div>

<div class="profile-details">
NAME - THEEKSHANA WIRASOORIYA<br>
UID - 13718578239<br>
ADDRESS - 13718578239-1001
</div>

<div class="store-section">

<div class="store-header">
<div class="store-text">TOP UP STORE</div>
</div>

<div class="store-box" id="box1"
onclick="selectItem('WEEKLY LITE',120,'count1','box1')">
<div class="w-icon">W</div>
<div class="box-text">WEEKLY LITE</div>
<div class="price-text">LKR 120.00</div>
<div class="counter">
<button class="minus" onclick="event.stopPropagation(); change('count1',false)">-</button>
<span id="count1">0</span>
<button class="plus" onclick="event.stopPropagation(); change('count1',true)">+</button>
</div>
</div>

<div class="store-box" id="box2"
onclick="selectItem('WEEKLY',505,'count2','box2')">
<div class="w-icon">W</div>
<div class="box-text">WEEKLY</div>
<div class="price-text">LKR 505.00</div>
<div class="counter">
<button class="minus" onclick="event.stopPropagation(); change('count2',false)">-</button>
<span id="count2">0</span>
<button class="plus" onclick="event.stopPropagation(); change('count2',true)">+</button>
</div>
</div>

<div class="store-box" id="box3"
onclick="selectItem('MONTHLY',2540,'count3','box3')">
<div class="w-icon">M</div>
<div class="box-text">MONTHLY</div>
<div class="price-text">LKR 2540.00</div>
<div class="counter">
<button class="minus" onclick="event.stopPropagation(); change('count3',false)">-</button>
<span id="count3">0</span>
<button class="plus" onclick="event.stopPropagation(); change('count3',true)">+</button>
</div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
push,
set,
onValue,
update
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyDdlxuM-11z-ahfHyPSPQeabds02s9C8ag",
authDomain: "project-001-1v.firebaseapp.com",
databaseURL: "https://project-001-1v-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId: "project-001-1v",
storageBucket: "project-001-1v.firebasestorage.app",
messagingSenderId: "778010407586",
appId: "1:778010407586:web:3b527def1374705d4dddfb",
measurementId: "G-VG8EYJBH3B"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const uid = "13718578239-1001";

let balance = 0;
let selectedPrice = 0;
let currentSelected = "";

const balanceText = document.getElementById("balanceText");

/* LOAD BALANCE */
onValue(ref(db, "ACCOUNT UPGRADE/" + uid), (snap) => {

const data = snap.val();

if(data && data.bank){
balance = parseFloat(data.bank);
}

balanceText.innerText = "LKR - " + balance.toFixed(2);

});

/* SELECT */
window.selectItem = function(name, price, id){

currentSelected = id;
selectedPrice = price;

document.getElementById("selected").innerText = name;

updateBill();
}

/* COUNT */
window.change = function(id, add){

if(currentSelected !== id) return;

let el = document.getElementById(id);
let val = parseInt(el.innerText);

val = add ? val + 1 : Math.max(0, val - 1);

el.innerText = val;

updateBill();
}

/* BILL */
function updateBill(){

if(!currentSelected) return;

let qty = parseInt(document.getElementById(currentSelected).innerText);

let total = qty * selectedPrice;

document.getElementById("billPrice").innerText = total;

document.getElementById("submitBtn").style.display =
total > 0 ? "block" : "none";
}

/* SUBMIT */
document.getElementById("submitBtn").onclick = async function(){

let total = parseInt(document.getElementById("billPrice").innerText);

if(total > balance){
alert("NOT ENOUGH BALANCE");
return;
}

let selected = document.getElementById("selected").innerText;

let qty = parseInt(document.getElementById(currentSelected).innerText);

/* SAVE ORDER */
await set(push(ref(db,"topup_orders")),{
uid: uid,
select: selected,
quantity: qty,
bill: total,
time: new Date().toLocaleString()
});

/* DEDUCT FROM FIREBASE */
await update(ref(db,"ACCOUNT UPGRADE/"+uid),{
bank: balance - total
});

alert("SUCCESS");

reset();
};

/* RESET */
function reset(){

document.getElementById("count1").innerText = 0;
document.getElementById("count2").innerText = 0;
document.getElementById("count3").innerText = 0;

document.getElementById("billPrice").innerText = 0;

document.getElementById("selected").innerText = "NONE";

document.getElementById("submitBtn").style.display = "none";

currentSelected = "";
}

</script>

</body>
</html>
