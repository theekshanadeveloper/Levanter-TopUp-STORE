<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Live Download Speed</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:black;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

/* Background Video */
.bg-video{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
    opacity:0;
    transition:opacity 1s ease;
}

/* Show Video */
.bg-video.show{
    opacity:1;
}

/* Overlay */
.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.45);
    z-index:-1;
}

/* Live Speed Box */
.speed-box{
    position:fixed;
    top:15px;
    right:15px;
    color:white;
    background:rgba(0,0,0,0.45);
    padding:8px 14px;
    border-radius:8px;
    font-size:13px;
    font-weight:bold;
    backdrop-filter:blur(5px);
    z-index:1000;
    min-width:110px;
    text-align:center;
}

/* Buttons */
.container{
    display:flex;
    gap:25px;
    z-index:2;
}

button{
    width:80px;
    height:32px;
    border:none;
    border-radius:5px;
    font-size:11px;
    font-weight:900;
    letter-spacing:1px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}

.login{
    background:white;
    color:black;
}

.register{
    background:yellow;
    color:black;
}

button:active{
    transform:scale(0.95);
}

/* Loading Screen */
.loader-screen{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    transition:opacity 0.8s ease;
}

/* Hide Loader */
.loader-screen.hide{
    opacity:0;
    pointer-events:none;
}

/* Loading Dots */
.loader{
    display:flex;
    gap:12px;
}

.loader span{
    width:16px;
    height:16px;
    background:white;
    border-radius:50%;
    animation:loading 1s infinite ease-in-out;
}

.loader span:nth-child(1){
    animation-delay:0s;
}

.loader span:nth-child(2){
    animation-delay:0.15s;
}

.loader span:nth-child(3){
    animation-delay:0.3s;
}

.loader span:nth-child(4){
    animation-delay:0.45s;
}

.loader span:nth-child(5){
    animation-delay:0.6s;
}

/* Animation */
@keyframes loading{

    0%,100%{
        transform:scale(0.5);
        opacity:0.3;
    }

    50%{
        transform:scale(1.3);
        opacity:1;
    }
}

</style>
</head>

<body>

<!-- LOADING -->
<div class="loader-screen" id="loader">

    <div class="loader">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

</div>

<!-- LIVE SPEED -->
<div class="speed-box" id="speed">
    0 KB/s
</div>

<!-- Video -->
<video autoplay muted loop playsinline
class="bg-video" id="bgVideo">

    <source
    src="https://github.com/theekshanadeveloper/Levanter-TopUp-STORE/raw/refs/heads/main/VID-20260522-WA0051.mp4"
    type="video/mp4">

</video>

<!-- Overlay -->
<div class="overlay"></div>

<!-- Buttons -->
<div class="container">

    <button class="login"
    onclick="window.location.href='login.html'">
    LOGIN
    </button>

    <button class="register"
    onclick="window.location.href='register.html'">
    REGISTER
    </button>

</div>

<script>

/* VIDEO LOADER */

const video =
document.getElementById("bgVideo");

const loader =
document.getElementById("loader");

/* When Video Ready */
video.addEventListener("canplaythrough", () => {

    video.classList.add("show");

    setTimeout(() => {

        loader.classList.add("hide");

    }, 500);

});

/* LIVE INTERNET SPEED */

const speedBox =
document.getElementById("speed");

async function checkSpeed(){

    const imageUrl =
    "https://upload.wikimedia.org/wikipedia/commons/3/3f/Fronalpstock_big.jpg?time=" + new Date().getTime();

    const startTime = Date.now();

    try{

        const response =
        await fetch(imageUrl);

        const blob =
        await response.blob();

        const endTime = Date.now();

        const duration =
        (endTime - startTime) / 1000;

        const bitsLoaded =
        blob.size * 8;

        const speedBps =
        bitsLoaded / duration;

        const speedKbps =
        speedBps / 1024;

        const speedMbps =
        speedKbps / 1024;

        if(speedMbps >= 1){

            speedBox.innerHTML =
            speedMbps.toFixed(2) + " MB/s";

        }else{

            speedBox.innerHTML =
            speedKbps.toFixed(2) + " KB/s";

        }

    }catch(error){

        speedBox.innerHTML = "OFFLINE";

    }

}

/* Update Every 3 Seconds */
setInterval(checkSpeed, 3000);

checkSpeed();

</script>

</body>
</html>
